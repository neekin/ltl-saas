name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK（版本来自 backend/global.json）
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: 还原依赖
        run: dotnet restore backend

      - name: 构建
        run: dotnet build backend --no-restore

      - name: 测试
        run: dotnet test backend --no-build --verbosity normal

  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 静态检查
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

  e2e:
    name: E2E 端到端测试（AGENTS §10）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ltl
          POSTGRES_PASSWORD: ltl_dev_password
          POSTGRES_DB: ltl
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ltl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK（版本来自 backend/global.json）
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: 构建后端
        run: dotnet build ../backend -v q

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E
        run: npm run e2e

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
