name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK（版本来自 backend/global.json）
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: 还原依赖
        run: dotnet restore backend

      - name: 构建
        run: dotnet build backend --no-restore

      - name: 测试
        run: dotnet test backend --no-build --verbosity normal

  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 静态检查
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build
