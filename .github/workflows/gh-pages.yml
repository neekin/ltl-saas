# GitHub Pages 官网部署：发布 website/ 目录（官网首页 + 使用文档 + 截图）
# 推送到 main 或手动触发后自动部署；无需本地构建（纯静态、零依赖）。
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
