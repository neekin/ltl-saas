# 本地开发环境：PostgreSQL + Redis
# 用法：cp .env.example .env && docker compose up -d
# 端口默认使用 5433 / 6380，避免与本机已有实例冲突；可在 .env 中调整。
services:
  postgres:
    image: postgres:17-alpine
    container_name: ltl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ltl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ltl_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ltl}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ltl} -d ${POSTGRES_DB:-ltl}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ltl-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
